[project]
name = "ai-agent-dock"
version = "0.1.0"
description = "AI Agent Dock: a general-purpose conversational agent platform that hosts applications"
readme = "README.md"
authors = [
    { name = "HOON PAEK", email = "hoon.paek@neoplatform.net" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "jsonschema>=4.26.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp>=2.3.0",
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
]

[project.scripts]
evals = "ai_agent_dock.evals_cli:main"  # uv run evals: 실제 모델 평가(uv run pytest --live와 같다)

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
